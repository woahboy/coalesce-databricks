        description: |-
          The customer value column, 'c_value', is derived from the 'customer' table based on 'c_acctbal' and 'c_mktsegment'.
          - It categorizes customers as 'High' or 'Low' value.
          - Customers with an account balance greater than 5000 and belonging to either the 'BUILDING' or 'HOUSEHOLD' market segments are classified as 'High' value; otherwise, they are 'Low' value.
          - This categorization helps prioritize customer service and marketing efforts towards high-value customers.
          - The CASE statement transformation logic is: `case when `customer`.`c_acctbal` > 5000 and `customer`.`c_mktsegment` in ('BUILDING', 'HOUSEHOLD') THEN 'High' ELSE 'Low' END`
        name: c_value
